name: Build Modified Turbo Gamer
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip android-sdk-build-tools
          curl -L https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          curl -L https://bitbucket.org/iBotPeaches/Apktool/downloads/apktool_2.9.3.jar -o apktool.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Extract APK Zip
        run: |
          mkdir -p turbo_gamer_extracted
          unzip -o "Turbo+Gamer+X+-+Game+Mode_5.0_APKPure.zip" -d turbo_gamer_extracted

      - name: Decompile APK
        run: |
          APK_PATH=$(find turbo_gamer_extracted -name "com.diffmemorymas.gamemode.pro.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          java -Xmx4G -jar /usr/local/bin/apktool.jar d "$APK_PATH" -f -o turbo_gamer_decoded

      - name: Apply Patches
        run: |
          python3 apply_patches.py

      - name: Rebuild APK
        run: |
          java -Xmx4G -jar /usr/local/bin/apktool.jar b turbo_gamer_decoded -o TurboGamerX_Modified.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out TurboGamerX_Modified_Signed.apk TurboGamerX_Modified.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboGamerX-Modified-APK
          path: TurboGamerX_Modified_Signed.apk
