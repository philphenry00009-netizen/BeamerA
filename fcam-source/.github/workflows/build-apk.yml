name: Build and Sign F-cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt

      - name: Build Unsigned APK
        run: |
            mkdir -p dist
            python3 clean_res.py
            apktool b . -o dist/F-cam-unsigned.apk