name: Build APK

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'

        - name: Extract and Setup
          run: |
            unzip camf.zip -d extracted
            # Find the folder with build.gradle and move its
  contents to root
            DIR=$(find extracted -name "build.gradle" -exec
  dirname {} \; | head -n 1)
            cp -r $DIR/* .
            chmod +x gradlew

        - name: Build
          run: ./gradlew assembleDebug

        - name: Upload
          uses: actions/upload-artifact@v3
          with:
            name: APK
            path: "**/app-debug.apk"
