name: Build APK

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'

        - name: Extract Source
          run: |
            if [ ! -f "camf.zip" ]; then echo "ERROR: camf.zip
  not found in repo!"; exit 1; fi
            unzip camf.zip -d extracted
            PROJECT_DIR=$(find extracted -name "build.gradle"
  -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then echo "ERROR: No
  build.gradle found in zip!"; exit 1; fi
            cp -r $PROJECT_DIR/* .
            chmod +x gradlew

        - name: Build APK
          run: ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v3
          with:
            name: APK
            path: "**/app-debug.apk"
