- name: Find and unzip project
  run: |
    echo "--- repo files ---"
    find . -maxdepth 3 -not -path './.git/*' | head -60
    ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n1)
    echo "ZIP=[$ZIP]"
    mkdir -p unpacked
    if [ -n "$ZIP" ]; then unzip -o -q "$ZIP" -d unpacked; else cp -r . unpacked/ 2>/dev/null; fi
    echo "--- unpacked ---"
    find unpacked -maxdepth 4 | head -60
    SETTINGS=$(find unpacked -name 'settings.gradle*' | head -n1)
    [ -z "$SETTINGS" ] && echo "NO settings.gradle FOUND" && exit 1
    echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
