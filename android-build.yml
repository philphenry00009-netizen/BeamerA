name: Build Android APK

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'
            cache: gradle

        - name: Unzip Source Code
          run: |
            sudo apt-get install unzip
            unzip camf.zip
            # Find where the build.gradle is and move everything
  to the root
            # This handles any folder nesting inside the zip
            find . -name "build.gradle" -exec dirname {} \; |
  head -n 1 | xargs -I {} sh -c 'cp -r {}/* .'
            # Clean up empty folders if any
            find . -type d -empty -delete

        - name: Make Gradle Wrapper Executable
          run: chmod +x gradlew || echo "gradlew not found in
  root, trying to find it..."

        - name: Build Debug APK
          run: ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v3
          with:
            name: BlackmagicClone-APK
            path: app/build/outputs/apk/debug/app-debug.apk
