
  name: Final-Android-Build

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'

        - name: Extract and Build
          run: |
            unzip camf.zip -d extracted
            PROJECT_DIR=$(find extracted -name "build.gradle"
  -exec dirname {} \; | head -n 1)
            cp -r $PROJECT_DIR/* .
            chmod +x gradlew
            ./gradlew assembleDebug

        - name: Upload
          uses: actions/upload-artifact@v3
          with:
            name: APK-FINAL
            path: "**/app-debug.apk"
