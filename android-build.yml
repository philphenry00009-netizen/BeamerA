name: Build Android APK

  on:
    push:
      branches: [ main ]
    workflow_dispatch: # Allows you to run it manually

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'
            cache: gradle

        - name: Unzip Source Code
          run: |
            sudo apt-get install unzip
            unzip camf.zip -d build_folder
            # Move the app folder to the root so Gradle can find
  it
            mv build_folder/blackmagic_clone/* .
            rm -rf build_folder

        - name: Make Gradle Wrapper Executable
          run: chmod +x gradlew

        - name: Build Debug APK
          run: ./gradlew assembleDebug

        - name: Upload APK
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'
            cache: gradle

        - name: Unzip Source Code
          run: |
            sudo apt-get install unzip
            unzip camf.zip -d build_folder
            # Move the app folder to the root so Gradle can find
  it
            mv build_folder/blackmagic_clone/* .
            rm -rf build_folder

        - name: Make Gradle Wrapper Executable
          run: chmod +x gradlew

        - name: Build Debug APK
          run: ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v3
          with:
            name: BlackmagicClone-APK
            path: app/build/outputs/apk/debug/app-debug.apk
