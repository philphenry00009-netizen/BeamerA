name: Build FcamerA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5name: Build APK

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Set up JDK 11
          uses: actions/setup-java@v3
          with:
            java-version: '11'
            distribution: 'temurin'

        - name: Extract Source
          run: |
            if [ ! -f "camf.zip" ]; then echo "ERROR: camf.zip
  not found in repo!"; exit 1; fi
            unzip camf.zip -d extracted
            PROJECT_DIR=$(find extracted -name "build.gradle"
  -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then echo "ERROR: No
  build.gradle found in zip!"; exit 1; fi
            cp -r $PROJECT_DIR/* .
            chmod +x gradlew

        - name: Build APK
          run: ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v3
          with:
            name: APK
            path: "**/app-debug.apk"

      # Unzips the project (if a .zip is in the repo) and finds the REAL Gradle
      # root: the folder that contains settings.gradle / settings.gradle.kts.
      # Your old run pointed Gradle at the repo root, which has no Gradle build.
      - name: Find and unzip project
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p "$GITHUB_WORKSPACE/project_src"
            unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/project_src"
            SEARCH="$GITHUB_WORKSPACE/project_src"
          else
            echo "No zip found, searching the repo itself"
            SEARCH="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$SEARCH" \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/build/*' \
            | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle(.kts) found anywhere. Folder layout (3 levels):"
            find "$SEARCH" -maxdepth 3 -not -path '*/.git/*' | head -60
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Change App Display Name to FcamerA
        run: |
          cd "$PROJECT_DIR"
          FILES=$(grep -rl --include=strings.xml 'name="app_name"' . || true)
          if [ -z "$FILES" ]; then
            echo "No app_name string found; name not changed"
          fi
          for f in $FILES; do
            sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1FcamerA\2#' "$f"
            echo "Renamed in $f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Uses the project's own gradlew when it has one, otherwise Gradle 8.7.
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Rename APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK=$(find "$PROJECT_DIR" -path '*build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced"
            find "$PROJECT_DIR" -name '*.apk' | head
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/dist/FcamerA-debug.apk"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: FcamerA-debug-apk
          path: dist/FcamerA-debug.apk
