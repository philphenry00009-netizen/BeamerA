- name: Find and unzip project
  shell: bash
  run: |
    set -euxo pipefail

    ZIP=$(find . -maxdepth 4 -iname '*.zip' | head -n 1)
    if [ -z "$ZIP" ]; then
      echo "No ZIP archive found in repository root"
      exit 1
    fi

    rm -rf unpacked
    unzip -o -q "$ZIP" -d unpacked

    SETTINGS=$(find unpacked -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)
    if [ -z "$SETTINGS" ]; then
      echo "No Gradle settings file found in unpacked archive"
      find unpacked -maxdepth 4 -print
      exit 1
    fi

    PROJECT_DIR=$(dirname "$SETTINGS")
    echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
    echo "Using project dir: $PROJECT_DIR"
